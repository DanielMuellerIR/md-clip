name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Erlaubt einen Lauf von Hand über die Actions-Oberfläche.
  workflow_dispatch:

# Der Testjob braucht weder Schreibzugriff noch ein dauerhaft hinterlegtes
# Git-Credential. Das gilt auch für Push-Läufe auf main.
permissions:
  contents: read

jobs:
  linux:
    name: Linux (Ubuntu 24.04, pandoc 3.1.3)
    runs-on: ubuntu-24.04
    env:
      TEST_PYTHON: /usr/bin/python3
    timeout-minutes: 15

    steps:
      # Unveränderlicher Commit statt eines beweglichen Versions-Tags; derselbe
      # geprüfte Pin wird im Appcast-Workflow verwendet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # pandoc + perl = die Konvertierungs-Pipeline, xclip = Clipboard unter X11,
      # xvfb = X-Server ohne Bildschirm (der Runner hat keinen).
      - name: Abhängigkeiten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc xclip xvfb sway wl-clipboard unzip shellcheck lua5.4

      - name: Versionen protokollieren
        run: |
          # Die gemeinsame Fixture-Erwartung ist gegen diese pandoc-Version
          # geprüft. Distributionskorrekturen sind erlaubt; ein Wechsel der
          # pandoc-Version muss bewusst geprüft werden.
          pandoc_version="$(pandoc --version)"
          pandoc_version="${pandoc_version%%$'\n'*}"
          printf '%s\n' "$pandoc_version"
          if [ "$pandoc_version" != 'pandoc 3.1.3' ]; then
            echo "Erwartet pandoc 3.1.3, bekam $pandoc_version" >&2
            exit 1
          fi
          perl -e 'print "perl $]\n"'
          "$TEST_PYTHON" --version
          ./bin/md-clip --version

      - name: Shell, Perl, Lua und Workflows prüfen
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          PATH="$(go env GOPATH)/bin:$PATH" ./tests/run-all.sh --lint

      - name: Fixtures und Verträge ohne System-Clipboard
        run: ./tests/run-all.sh

      - name: Isoliertes X11
        run: ./tests/run-all.sh --x11

      - name: Isoliertes Wayland
        run: ./tests/run-all.sh --wayland

  macos:
    name: macOS 15 arm64 (pandoc ${{ matrix.converter }})
    # Der Bundle-Pin braucht arm64; Runnerreferenz:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        converter: [system, bundled]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Aktuelles System-pandoc installieren
        if: matrix.converter == 'system'
        run: brew install pandoc
      - name: Exaktes Bundle-pandoc bereitstellen
        if: matrix.converter == 'bundled'
        run: |
          bash tests/prepare-bundled-pandoc.sh "$RUNNER_TEMP/md-clip-pandoc"
          printf '%s\n' "$RUNNER_TEMP/md-clip-pandoc" >> "$GITHUB_PATH"
      - name: Architektur und Testversionen protokollieren
        run: |
          uname -m
          command -v pandoc
          pandoc --version
          test_python="$(command -v python3)"
          printf 'TEST_PYTHON=%s\n' "$test_python" >> "$GITHUB_ENV"
          "$test_python" --version
      - name: CLI an den ausgewählten Konverter binden
        run: |
          # Die macOS-CLI ergänzt Homebrew im PATH. Der explizite lokale
          # Konverter hat Vorrang und hält Writer und Roundtrip-Reader gleich.
          test ! -e bin/pandoc && test ! -L bin/pandoc
          ln -s "$(command -v pandoc)" bin/pandoc
      - name: Fixtures, CLI und isolierte Wrapper
        run: ./tests/run-all.sh
      - name: Unsigniertes Bundle bauen und Konvertierung ausführen
        if: matrix.converter == 'bundled'
        run: |
          source wrappers/pandoc-pin.sh
          mkdir -p build/cache
          cp "$RUNNER_TEMP/md-clip-pandoc/pandoc-${PANDOC_VERSION}-arm64-macOS.zip" \
            "build/cache/pandoc-${PANDOC_VERSION}-arm64.zip"
          bash build.sh
          ./tests/run-all.sh --bundle build/md-clip.app
