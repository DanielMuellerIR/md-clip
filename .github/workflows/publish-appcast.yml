# Veroeffentlicht nach jedem GitHub-Release den signierten Sparkle-Feed
# (appcast.xml) ueber GitHub Pages. Die installierte md-clip.app fragt diesen
# Feed ab (SUFeedURL in der Info.plist) und bietet gefundene Updates an.
#
# Anders als in poormans_text gibt es hier kein SwiftPM: Sparkles
# generate_appcast kommt aus derselben exakt gepinnten Binaer-Distribution,
# die auch wrappers/build-app-bundled.sh ins Bundle packt — Version und
# Pruefsumme werden von dort gelesen, damit nichts auseinanderdriftet.
name: Publish Sparkle appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Bereits veroeffentlichtes Release-Tag, zum Beispiel v1.2.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Der private Sparkle-Schluessel steht bewusst NICHT hier, sondern nur im
    # Schritt, der signiert. Im Job-env laege er sonst in jedem Schritt offen —
    # auch in Actions Dritter — und dasselbe Schluesselpaar signiert die Updates
    # von drei Apps (Review-Fund 2026-08-06).
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Ausgecheckt wird der Stand DES RELEASES, nicht der Branch, aus dem der
      # Lauf gestartet wurde. Sonst verarbeitete ein manueller Lauf ein altes
      # Release mit den Werkzeugen und Sparkle-Pins eines anderen Stands
      # (Review-Fund 2026-08-06).
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Ensure the tag is the current stable release
        shell: bash
        run: |
          set -euo pipefail
          # Der Feed traegt genau einen Eintrag (--maximum-versions 1) und wird
          # bei jedem Lauf komplett ersetzt. Deshalb darf nur das aktuelle
          # stabile Release hinein: Ein Prerelease wuerde stabilen Clients
          # angeboten, und ein manueller Lauf fuer ein aelteres Tag nimmt das
          # aktuelle Update wieder aus dem Feed (Review-Fund 2026-08-06).
          release_json="$(gh release view "$RELEASE_TAG" \
            --json isPrerelease,isDraft,isLatest)"
          prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          draft="$(jq -r '.isDraft' <<<"$release_json")"
          latest="$(jq -r '.isLatest' <<<"$release_json")"

          if [[ "$prerelease" != "false" || "$draft" != "false" ]]; then
            echo "FEHLER: $RELEASE_TAG ist ein Prerelease oder Entwurf und gehoert nicht in den stabilen Feed." >&2
            exit 1
          fi
          if [[ "$latest" != "true" ]]; then
            echo "FEHLER: $RELEASE_TAG ist nicht das aktuelle stabile Release; der Feed wuerde zurueckfallen." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Download release disk image and release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir update

          shopt -s nullglob
          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release $RELEASE_TAG muss genau ein DMG enthalten." >&2
            exit 1
          fi

          # Tag, DMG-Name und ausgecheckte Produktversion muessen dieselbe
          # Version meinen — sonst signierte der Feed ein Archiv, das nicht zum
          # ausgecheckten Quellstand gehoert.
          version="${RELEASE_TAG#v}"
          product_version="$(grep '^VERSION=' bin/md-clip | cut -d'"' -f2)"
          if [[ "$product_version" != "$version" ]]; then
            echo "FEHLER: bin/md-clip meldet $product_version, das Tag sagt $version." >&2
            exit 1
          fi
          if [[ "$(basename "${dmgs[0]}")" != "md-clip-${version}.dmg" ]]; then
            echo "FEHLER: DMG heisst $(basename "${dmgs[0]}"), erwartet war md-clip-${version}.dmg." >&2
            exit 1
          fi

          # Gleicher Basisname: generate_appcast ordnet die Markdown-Datei dem DMG zu.
          gh release view "$RELEASE_TAG" --json body --jq .body > "${dmgs[0]%.dmg}.md"

      - name: Fetch pinned Sparkle tools
        shell: bash
        run: |
          set -euo pipefail
          # Version und Pruefsumme aus dem Build-Skript lesen — eine Quelle,
          # kein zweiter Pin, der wegdriften kann.
          SPARKLE_VERSION=$(grep '^SPARKLE_VERSION=' wrappers/build-app-bundled.sh | cut -d'"' -f2)
          SPARKLE_TAR_SHA256=$(grep '^SPARKLE_TAR_SHA256=' wrappers/build-app-bundled.sh | cut -d'"' -f2)
          if [[ -z "$SPARKLE_VERSION" || -z "$SPARKLE_TAR_SHA256" ]]; then
            echo "FEHLER: Sparkle-Pin nicht aus wrappers/build-app-bundled.sh lesbar." >&2
            exit 1
          fi

          source wrappers/verified-cache.sh
          download_verified \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            "$SPARKLE_TAR_SHA256" \
            sparkle-dist.tar.xz

          mkdir -p sparkle-dist
          tar -x -C sparkle-dist -f sparkle-dist.tar.xz ./bin/generate_appcast
          test -x sparkle-dist/bin/generate_appcast

      - name: Generate signed appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "FEHLER: GitHub-Secret SPARKLE_PRIVATE_KEY fehlt." >&2
            exit 1
          fi

          # Der geheime Schluessel steht weder in argv noch in einer Datei oder im Log.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | sparkle-dist/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "$PWD/site/appcast.xml" \
            "$PWD/update"

          xmllint --noout site/appcast.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish appcast on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
