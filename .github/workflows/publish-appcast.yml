# Veroeffentlicht nach dem unprivilegierten Release-Dispatcher den signierten
# Sparkle-Feed (appcast.xml) ueber GitHub Pages. workflow_run laedt diese Datei
# aus dem Default-Branch, nicht aus dem Release-Tag.
#
# Der Release-Tag ist absichtlich nur Datenquelle. Downloader, Sparkle-Pins und
# Generator kommen aus einem fest eingetragenen Tooling-SHA; Shell-Code daraus
# wird nie mit dem privaten Sparkle-Schluessel zusammen ausgefuehrt.
name: Publish Sparkle appcast

on:
  workflow_run:
    workflows: [Request Sparkle appcast]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Aktuelles stabiles Release-Tag; nur Wiederholung eines fehlgeschlagenen Appcast-Laufs
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    # workflow_run kommt aus dem Default-Branch. Ein manueller Lauf ist nur
    # dort erlaubt, damit ein Tag keine veraenderte Workflow-Datei samt Secret
    # ausfuehren kann.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Select current stable release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # BEGIN RELEASE_TAG_SELECTOR
          validate_release_tag() {
            local candidate="$1"
            case "$candidate" in
              *$'\n'*|*$'\r'*)
                echo "FEHLER: Release-Tag muss genau eine Zeile enthalten." >&2
                return 64
                ;;
            esac
            if [[ ! "$candidate" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "FEHLER: Ungueltiges stabiles Release-Tag: '$candidate'." >&2
              return 64
            fi
          }

          select_release_tag() {
            local requested_tag="$1"
            local latest_tag

            case "$GITHUB_EVENT_NAME" in
              workflow_dispatch)
                # Manuelle Eingaben werden validiert, aber niemals selbst an
                # spaetere Schritte weitergereicht.
                validate_release_tag "$requested_tag" || return $?
                ;;
              workflow_run)
                if [[ -n "$requested_tag" ]]; then
                  echo "FEHLER: Automatischer Lauf erhielt unerwartet eine Tag-Eingabe." >&2
                  return 64
                fi
                ;;
              *)
                echo "FEHLER: Unerwarteter Workflow-Ausloeser: $GITHUB_EVENT_NAME" >&2
                return 64
                ;;
            esac

            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" || return $?
            validate_release_tag "$latest_tag" || return $?
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$requested_tag" != "$latest_tag" ]]; then
              echo "FEHLER: $requested_tag ist nicht das aktuelle stabile Release ($latest_tag)." >&2
              return 1
            fi

            # Erst nach allen Prüfungen schreiben, und ausschließlich den von
            # der API ermittelten Wert — nie die manuelle Eingabe.
            printf '%s\n' "RELEASE_TAG=$latest_tag" >> "$GITHUB_ENV"
          }
          # END RELEASE_TAG_SELECTOR

          select_release_tag "${REQUESTED_TAG:-}"
          # runner.temp ist erst innerhalb eines laufenden Schritts verfügbar,
          # nicht beim Auflösen des jobweiten env-Blocks.
          printf '%s\n' "APPCAST_WORK=$RUNNER_TEMP/md-clip-appcast" >> "$GITHUB_ENV"

      # Alle fremden Actions sind unveraenderlich an Commit-SHAs gebunden.
      # Dieser SHA ist absichtlich ein Literal statt einer Environment-Variable:
      # GITHUB_ENV kann ihn dadurch nicht ueberschreiben.
      - name: Check out trusted appcast tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 9eaffab05a3984ac5f01d0a3fa331a3f84304248
          path: tooling
          persist-credentials: false

      # Der Tag liegt in einem getrennten Verzeichnis und liefert nur
      # bin/md-clip als Versionsquelle. Kein Skript daraus wird ausgefuehrt.
      - name: Check out release data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false

      - name: Verify separated checkouts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git -C tooling rev-parse HEAD)" != "9eaffab05a3984ac5f01d0a3fa331a3f84304248" ]]; then
            echo "FEHLER: Tooling-Checkout entspricht nicht dem freigegebenen Commit." >&2
            exit 1
          fi
          tag_commit="$(git -C release-source rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$(git -C release-source rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "FEHLER: Release-Checkout entspricht nicht $RELEASE_TAG." >&2
            exit 1
          fi

      - name: Ensure the tag is the current stable release
        shell: bash
        run: |
          set -euo pipefail
          # Der Feed traegt genau einen Eintrag und wird bei jedem Lauf komplett
          # ersetzt. Ein Prerelease oder aelteres Tag wuerde den stabilen Feed
          # deshalb unbrauchbar machen.
          release_state="$(gh release view "$RELEASE_TAG" \
            -R "$GITHUB_REPOSITORY" \
            --json isPrerelease,isDraft \
            --jq '[.isPrerelease, .isDraft] | @tsv')"
          IFS=$'\t' read -r prerelease draft <<< "$release_state"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"

          if [[ "$prerelease" != "false" || "$draft" != "false" ]]; then
            echo "FEHLER: $RELEASE_TAG ist ein Prerelease oder Entwurf und gehoert nicht in den stabilen Feed." >&2
            exit 1
          fi
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "FEHLER: $RELEASE_TAG ist nicht das aktuelle stabile Release ($latest_tag); der Feed wuerde zurueckfallen." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download release data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APPCAST_WORK/update" "$APPCAST_WORK/site"
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --dir "$APPCAST_WORK/update"

          shopt -s nullglob
          dmgs=("$APPCAST_WORK"/update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release $RELEASE_TAG muss genau ein DMG enthalten." >&2
            exit 1
          fi

          # Tag, DMG-Name und Produktquelle muessen dieselbe Version meinen.
          # Die Datei aus dem Tag wird nur gelesen, nie gesourct oder gestartet.
          version="${RELEASE_TAG#v}"
          product_version="$(grep '^VERSION=' release-source/bin/md-clip | cut -d'"' -f2)"
          if [[ "$product_version" != "$version" ]]; then
            echo "FEHLER: bin/md-clip meldet $product_version, das Tag sagt $version." >&2
            exit 1
          fi
          if [[ "$(basename "${dmgs[0]}")" != "md-clip-${version}.dmg" ]]; then
            echo "FEHLER: DMG heisst $(basename "${dmgs[0]}"), erwartet war md-clip-${version}.dmg." >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --json body --jq .body > "${dmgs[0]%.dmg}.md"

      - name: Fetch pinned Sparkle tool without secret
        shell: bash
        run: |
          set -euo pipefail
          # Downloader und Pins kommen ausschliesslich aus dem festen Tooling-SHA.
          # Das Ziel liegt ausserhalb beider Checkouts in einem Runner-Tempordner.
          SPARKLE_VERSION="$(grep '^SPARKLE_VERSION=' tooling/wrappers/build-app-bundled.sh | cut -d'"' -f2)"
          SPARKLE_TAR_SHA256="$(grep '^SPARKLE_TAR_SHA256=' tooling/wrappers/build-app-bundled.sh | cut -d'"' -f2)"
          if [[ -z "$SPARKLE_VERSION" || -z "$SPARKLE_TAR_SHA256" ]]; then
            echo "FEHLER: Sparkle-Pin nicht aus der Tooling-Revision lesbar." >&2
            exit 1
          fi

          source tooling/wrappers/verified-cache.sh
          download_verified \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            "$SPARKLE_TAR_SHA256" \
            "$APPCAST_WORK/sparkle-dist.tar.xz"

          mkdir -p "$APPCAST_WORK/sparkle-dist"
          tar -x -C "$APPCAST_WORK/sparkle-dist" \
            -f "$APPCAST_WORK/sparkle-dist.tar.xz" ./bin/generate_appcast
          test -x "$APPCAST_WORK/sparkle-dist/bin/generate_appcast"
          swiftc tooling/helpers/verify-sparkle-signature.swift \
            -o "$APPCAST_WORK/verify-sparkle-signature"

      - name: Generate and verify signed appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sparkle_private_key="$SPARKLE_PRIVATE_KEY"
          unset SPARKLE_PRIVATE_KEY
          if [[ -z "$sparkle_private_key" ]]; then
            echo "FEHLER: GitHub-Secret SPARKLE_PRIVATE_KEY fehlt." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          product_version="$(grep '^VERSION=' release-source/bin/md-clip | cut -d'"' -f2)"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/md-clip-${version}.dmg"

          # BEGIN APPCAST_GENERATOR_RUNNER
          run_appcast_generator() {
            local generator_output
            # Command-Substitution wartet auf die gesamte Pipeline und erfasst
            # stdout und stderr gemeinsam. Sparkle schreibt auch sicherheits-
            # relevante Warnungen auf stdout; eine asynchrone Prozess-
            # substitution koennte beim anschliessenden grep noch leer sein.
            if ! generator_output="$(printf '%s' "$sparkle_private_key" | "$@" 2>&1)"; then
              printf '%s\n' "$generator_output" >&2
              return 1
            fi
            printf '%s\n' "$generator_output" >&2
            if grep -Fq 'does not match key EdDSA' <<<"$generator_output"; then
              echo "FEHLER: SPARKLE_PRIVATE_KEY passt nicht zum öffentlichen Schlüssel der App." >&2
              return 1
            fi
          }
          # END APPCAST_GENERATOR_RUNNER

          # Der Schluessel steht weder in argv noch in einer Datei oder im Log.
          run_appcast_generator \
            "$APPCAST_WORK/sparkle-dist/bin/generate_appcast" \
              --ed-key-file - \
              --embed-release-notes \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}" \
              -o "$APPCAST_WORK/site/appcast.xml" \
              "$APPCAST_WORK/update"
          unset sparkle_private_key

          # BEGIN APPCAST_METADATA_VALIDATOR
          validate_appcast() {
            local appcast_file="$1"
            local expected_version="$2"
            local expected_short_version="$3"
            local expected_enclosure_url="$4"
            local item_xpath='/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"]'
            local enclosure_xpath="${item_xpath}/*[local-name()=\"enclosure\"]"
            local version_xpath="${item_xpath}/*[local-name()=\"version\"]"
            local short_version_xpath="${item_xpath}/*[local-name()=\"shortVersionString\"]"
            local item_count enclosure_count feed_version feed_short_version feed_url feed_signature

            xmllint --noout "$appcast_file"
            item_count="$(xmllint --xpath "count(${item_xpath})" "$appcast_file")"
            enclosure_count="$(xmllint --xpath "count(${enclosure_xpath})" "$appcast_file")"
            feed_version="$(xmllint --xpath "string(${version_xpath})" "$appcast_file")"
            feed_short_version="$(xmllint --xpath "string(${short_version_xpath})" "$appcast_file")"
            feed_url="$(xmllint --xpath "string(${enclosure_xpath}/@url)" "$appcast_file")"
            feed_signature="$(xmllint --xpath "string(${enclosure_xpath}/@*[local-name()=\"edSignature\"])" "$appcast_file")"

            if [[ "$item_count" != "1" || "$enclosure_count" != "1" ]]; then
              echo "FEHLER: Appcast braucht genau einen Eintrag mit genau einem Enclosure (gefunden: $item_count/$enclosure_count)." >&2
              return 1
            fi
            if [[ "$feed_version" != "$expected_version" || "$feed_short_version" != "$expected_short_version" ]]; then
              echo "FEHLER: Appcast-Versionen '$feed_version'/'$feed_short_version' passen nicht zu $expected_version." >&2
              return 1
            fi
            if [[ "$feed_url" != "$expected_enclosure_url" ]]; then
              echo "FEHLER: Appcast-URL '$feed_url' passt nicht zu '$expected_enclosure_url'." >&2
              return 1
            fi
            if [[ -z "$feed_signature" ]]; then
              echo "FEHLER: Appcast-Enclosure hat keine Sparkle-EdDSA-Signatur." >&2
              return 1
            fi
          }
          # END APPCAST_METADATA_VALIDATOR

          validate_appcast \
            "$APPCAST_WORK/site/appcast.xml" \
            "$version" \
            "$product_version" \
            "$expected_url"

          # Die Generator-Warnung oben ist nur eine Zusatzdiagnose. Der
          # eigentliche Vertrauensnachweis prüft die DMG-Bytes kryptografisch
          # gegen SUPublicEDKey aus genau der App, die im Release-DMG liegt.
          shopt -s nullglob
          dmgs=("$APPCAST_WORK"/update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release-Verzeichnis enthält nicht genau ein DMG." >&2
            exit 1
          fi

          mount_dir="$(mktemp -d "$APPCAST_WORK/.release-mount.XXXXXX")"
          attach_plist="$(mktemp "$APPCAST_WORK/.release-attach.plist.XXXXXX")"
          mount_device=""
          cleanup_release_mount() {
            local attempt
            if [[ -n "$mount_device" ]]; then
              for attempt in 1 2 3; do
                if hdiutil detach "$mount_device" >/dev/null 2>&1; then
                  mount_device=""
                  break
                fi
                sleep 2
              done
            fi
            if [[ -n "$mount_device" ]]; then
              echo "WARNUNG: Release-DMG blieb auf $mount_device eingehängt." >&2
              return 0
            fi
            rmdir "$mount_dir" >/dev/null 2>&1 || true
            rm -f "$attach_plist"
          }
          trap cleanup_release_mount EXIT

          hdiutil attach "${dmgs[0]}" \
            -readonly -nobrowse -noverify -noautoopen \
            -mountpoint "$mount_dir" -plist > "$attach_plist"

          index=0
          while device=$(/usr/libexec/PlistBuddy \
            -c "Print :system-entities:$index:dev-entry" "$attach_plist" 2>/dev/null); do
            candidate_mount=$(/usr/libexec/PlistBuddy \
              -c "Print :system-entities:$index:mount-point" "$attach_plist" 2>/dev/null || true)
            if [[ "$candidate_mount" == "$mount_dir" ]]; then
              mount_device="$device"
              break
            fi
            index=$((index + 1))
          done
          if [[ -z "$mount_device" ]]; then
            echo "FEHLER: Device des Release-DMGs nicht gefunden." >&2
            exit 1
          fi

          app_bundles=("$mount_dir"/*.app)
          if (( ${#app_bundles[@]} != 1 )); then
            echo "FEHLER: Release-DMG muss genau ein App-Bundle enthalten." >&2
            exit 1
          fi
          public_key=$(/usr/libexec/PlistBuddy \
            -c 'Print :SUPublicEDKey' "${app_bundles[0]}/Contents/Info.plist")
          feed_signature=$(xmllint --xpath \
            'string(/*[local-name()="rss"]/*[local-name()="channel"]/*[local-name()="item"]/*[local-name()="enclosure"]/@*[local-name()="edSignature"])' \
            "$APPCAST_WORK/site/appcast.xml")
          "$APPCAST_WORK/verify-sparkle-signature" \
            "$public_key" "$feed_signature" "${dmgs[0]}"

          cleanup_release_mount
          trap - EXIT

      # Derselbe Pfad wie APPCAST_WORK, aber bewusst noch einmal ausgeschrieben:
      # `runner.temp` gibt es hier, `env.APPCAST_WORK` waere erst zur Laufzeit
      # des Schritts belegt und liesse sich hier nicht nachpruefen. Dass beide
      # Schreibweisen zusammenpassen, haelt tests/test-wrapper-safety.sh fest.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/md-clip-appcast/site

      - name: Publish appcast on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
